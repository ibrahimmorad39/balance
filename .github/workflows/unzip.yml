name: unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir /tmp/x
          for z in *.zip; do unzip -o "$z" -d /tmp/x; done
          f=$(find /tmp/x -name index.html | head -1)
          cp -r "$(dirname "$f")"/. .
          git rm -q *.zip
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "unzip site"
          git push
